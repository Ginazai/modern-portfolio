<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rafael Caballero, computer systems engineering student and software developer building robust backend systems and clean APIs." />
    <meta name="theme-color" content="#0B0E0F" />
    <title>Rafael Caballero | Portfolio</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the brand default.
      try {
        var saved = localStorage.getItem('rc-theme');
        document.documentElement.classList.toggle('dark', saved !== 'light');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
